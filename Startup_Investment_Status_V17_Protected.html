<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Protected Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(135deg,#0d2438,#12314d);color:#1b2a36}
.card{background:#fff;border-radius:12px;padding:30px 28px;width:min(400px,92vw);box-shadow:0 16px 48px rgba(0,0,0,.4)}
h1{margin:0 0 4px;font-size:19px;color:#0d2438}
p{margin:0 0 18px;font-size:12.5px;color:#5b6b78}
label{display:block;font-size:10.5px;font-weight:700;color:#5b6b78;text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px}
.pw{display:flex;gap:6px}
input{flex:1;padding:10px 11px;border:1px solid #d7e0e8;border-radius:7px;font-size:14px;background:#fbfcfd;min-width:0}
input:focus{outline:2px solid #1e6fb5;background:#fff}
button{padding:10px 14px;border-radius:7px;border:1px solid #d7e0e8;background:#fff;font-weight:600;font-size:13px;cursor:pointer;color:#12314d}
button.go{width:100%;margin-top:14px;background:#1e6fb5;border-color:#1e6fb5;color:#fff;font-size:14px}
button.go:disabled{opacity:.6;cursor:wait}
#msg{min-height:18px;margin-top:12px;font-size:12.5px;font-weight:600;color:#c0392b}
</style></head><body>
<div class="card">
  <h1>Protected Dashboard</h1>
  <p>Enter the password to open this dashboard.</p>

  <div class="pw"><input type="password" id="pw" autocomplete="current-password" autofocus><button type="button" id="eye">Show</button></div>
  <button class="go" id="go" type="button">Unlock</button>
  <div id="msg"></div>
</div>

pw.addEventListener('keydown',function(e){if(e.key==='Enter')unlock();});
go.onclick=unlock;
function b2u(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
async function unlock(){
  if(!pw.value){msg.textContent='Enter the password.';return;}
  if(!(window.crypto&&crypto.subtle)){msg.textContent='Secure context required. Open via https:// or localhost.';return;}
  go.disabled=true;msg.style.color='#5b6b78';msg.textContent='Verifying...';
  try{
    var raw=b2u(DATA),salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.value),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
    var html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
  }catch(e){
    fails++;msg.style.color='#c0392b';msg.textContent='Incorrect password.';pw.value='';pw.focus();
    var wait=Math.min(fails*2,20);go.textContent='Wait '+wait+'s';
    var t=setInterval(function(){wait--;if(wait<=0){clearInterval(t);go.disabled=false;go.textContent='Unlock';}else go.textContent='Wait '+wait+'s';},1000);
    return;
  }
}
})();
</script>
</body></html>
